name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drag a .heic file from the Desktop
        2. Hold Shift and drop it on PNG
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dropwheel version
      description: Menu bar icon → About Dropwheel
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.6, MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Example file (optional)
      description: If it helps, attach a file that shows the problem. Please remove anything private first.
